<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockSpot Maps</title>
  <link href="maplibre-gl.css" rel="stylesheet" />
  <script src="maplibre-gl.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0f1117;
      color: #f0f0f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #map { flex: 1; width: 100%; }

    /* Panel */
    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .input-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-start { background: #22c55e; }
    .dot-end { background: #ef4444; }

    .input-row input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #f0f0f0;
      font-size: 14px;
      font-family: inherit;
    }

    .input-row input::placeholder { color: rgba(255,255,255,0.35); }

    .btn-route {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-route:hover { background: #1d4ed8; }
    .btn-route:disabled { background: #374151; cursor: default; }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-mode {
      flex: 1;
      background: rgba(15,17,23,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      font-family: inherit;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .btn-mode.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    /* Instructions */
    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,17,23,0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* Directions panel */
    #directions {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 280px;
      max-height: calc(100vh - 24px);
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      padding: 14px;
    }

    #directions h3 {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .dir-summary {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .dir-stat {
      flex: 1;
      text-align: center;
    }

    .dir-stat-val {
      font-size: 20px;
      font-weight: 600;
      color: #2563eb;
    }

    .dir-stat-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    .dir-step {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
      line-height: 1.4;
      color: rgba(255,255,255,0.75);
    }

    .dir-step-icon {
      font-size: 14px;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
      margin-top: 1px;
    }

    .dir-step-dist {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 2px;
    }

    .btn-clear {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: rgba(255,255,255,0.5);
      font-family: inherit;
      font-size: 13px;
      padding: 8px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.15s;
    }

    .btn-clear:hover { background: rgba(255,255,255,0.1); color: white; }

    /* Scrollbar */
    #directions::-webkit-scrollbar { width: 4px; }
    #directions::-webkit-scrollbar-track { background: transparent; }
    #directions::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Mobile bottom sheet */
    @media (max-width: 600px) {
      #panel { max-width: 100%; }

      #directions {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 40vh;
        border-radius: 16px 16px 0 0;
        border-bottom: none;
      }

      #directions::before {
        content: '';
        display: block;
        width: 36px;
        height: 4px;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
        margin: 0 auto 12px;
      }
    }
  </style>
</head>
<body>

<div id="panel">
  <div style="display:flex; gap:8px;">
    <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
      <div class="input-row">
        <div class="input-dot dot-start"></div>
        <input id="input-start" type="text" placeholder="Starting point — or tap map">
      </div>
      <div class="input-row">
        <div class="input-dot dot-end"></div>
        <input id="input-end" type="text" placeholder="Destination — or tap map">
      </div>
    </div>
    <button class="btn-route" id="btn-route" onclick="getRoute()">Go</button>
  </div>
  <div class="btn-row">
    <button class="btn-mode active" id="mode-driving" onclick="setMode('driving')">🚗 Drive</button>
    <button class="btn-mode" id="mode-cycling" onclick="setMode('cycling')" style="opacity:0.35;cursor:not-allowed;" disabled title="Coming soon">🚲 Bike</button>
    <button class="btn-mode" id="mode-walking" onclick="setMode('walking')" style="opacity:0.35;cursor:not-allowed;" disabled title="Coming soon">🚶 Walk</button>
  </div>
</div>

<div id="directions">
  <h3>Directions</h3>
  <div class="dir-summary">
    <div class="dir-stat">
      <div class="dir-stat-val" id="dir-duration">—</div>
      <div class="dir-stat-label">minutes</div>
    </div>
    <div class="dir-stat">
      <div class="dir-stat-val" id="dir-distance">—</div>
      <div class="dir-stat-label">miles</div>
    </div>
  </div>
  <div id="dir-steps"></div>
  <button class="btn-clear" onclick="clearRoute()">✕ Clear route</button>
</div>

<div id="hint">Tap map to set start point</div>

<div id="map"></div>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'http://192.168.8.211/mapserver/styles/basic-preview/style.json',
    center: [-71.46, 43.20],
    zoom: 8
  });

  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
  map.addControl(new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true
  }), 'bottom-right');

  let startCoord = null, endCoord = null;
  let startMarker = null, endMarker = null;
  let clickMode = 'start';
  let travelMode = 'driving';

  const hint = document.getElementById('hint');

  function setMode(mode) {
    travelMode = mode;
    document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + mode).classList.add('active');
    if (startCoord && endCoord) getRoute();
  }

  function makeMarker(color) {
    const el = document.createElement('div');
    el.style.cssText = `width:14px;height:14px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);`;
    return el;
  }

  // Prevent panel taps from triggering map clicks on mobile
  document.getElementById('panel').addEventListener('click', e => e.stopPropagation());
  document.getElementById('directions').addEventListener('click', e => e.stopPropagation());
  document.getElementById('directions').addEventListener('touchstart', e => e.stopPropagation());

  map.on('click', (e) => {
    if (isNaN(e.lngLat.lng) || isNaN(e.lngLat.lat)) return;
    const coord = [e.lngLat.lng, e.lngLat.lat];
    if (clickMode === 'start') {
      startCoord = coord;
      document.getElementById('input-start').value = `${coord[1].toFixed(5)}, ${coord[0].toFixed(5)}`;
      if (startMarker) startMarker.remove();
      startMarker = new maplibregl.Marker({ element: makeMarker('#22c55e') }).setLngLat(coord).addTo(map);
      clickMode = 'end';
      hint.textContent = 'Now tap map to set destination';
    } else {
      endCoord = coord;
      document.getElementById('input-end').value = `${coord[1].toFixed(5)}, ${coord[0].toFixed(5)}`;
      if (endMarker) endMarker.remove();
      endMarker = new maplibregl.Marker({ element: makeMarker('#ef4444') }).setLngLat(coord).addTo(map);
      hint.style.opacity = '0';
      getRoute();
    }
  });

  function formatDist(meters) {
    const miles = meters / 1609.34;
    return miles < 0.1 ? `${Math.round(meters)}m` : `${miles.toFixed(1)} mi`;
  }

  function formatDuration(seconds) {
    const m = Math.round(seconds / 60);
    if (m < 60) return m;
    return `${Math.floor(m/60)}h ${m%60}m`;
  }

  function stepIcon(type) {
    const icons = {
      'turn-left': '↰', 'turn-right': '↱', 'turn-slight-left': '↖', 'turn-slight-right': '↗',
      'turn-sharp-left': '⬅', 'turn-sharp-right': '➡', 'uturn': '↩', 'roundabout': '🔄',
      'merge': '⤵', 'on ramp': '⤴', 'off ramp': '⤵', 'fork': '⑂', 'end of road': '⛳',
      'arrive': '📍', 'depart': '🟢', 'continue': '↑'
    };
    return icons[type] || '↑';
  }

  async function getRoute() {
    if (!startCoord || !endCoord) return;

    const osrmMode = 'driving'; // OSRM processed with car.lua only
    // Note: to support bike/walk, reprocess OSM data with bicycle.lua and foot.lua
    const url = `/osrm/route/v1/${osrmMode}/${startCoord[0]},${startCoord[1]};${endCoord[0]},${endCoord[1]}?steps=true&geometries=geojson&overview=full`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.code !== 'Ok') { alert('No route found.'); return; }

      const route = data.routes[0];
      const coords = route.geometry.coordinates;

      // Draw route
      if (map.getLayer('route')) map.removeLayer('route');
      if (map.getSource('route')) map.removeSource('route');

      map.addSource('route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: route.geometry }
      });

      map.addLayer({
        id: 'route',
        type: 'line',
        source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#2563eb', 'line-width': 5, 'line-opacity': 0.85 }
      });

      // Fit map to route
      const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      const isMobile = window.innerWidth <= 600;
      map.fitBounds(bounds, { padding: { top: 160, bottom: isMobile ? 220 : 60, left: 20, right: isMobile ? 20 : 300 } });

      // Show directions panel
      document.getElementById('dir-duration').textContent = formatDuration(route.duration);
      document.getElementById('dir-distance').textContent = (route.distance / 1609.34).toFixed(1);

      const stepsEl = document.getElementById('dir-steps');
      stepsEl.innerHTML = '';
      route.legs[0].steps.forEach(step => {
        const div = document.createElement('div');
        div.className = 'dir-step';
        const maneuver = step.maneuver.type + (step.maneuver.modifier ? '-' + step.maneuver.modifier : '');
        div.innerHTML = `
          <div class="dir-step-icon">${stepIcon(maneuver)}</div>
          <div>
            <div>${step.name || 'Unnamed road'}</div>
            <div class="dir-step-dist">${formatDist(step.distance)}</div>
          </div>`;
        stepsEl.appendChild(div);
      });

      document.getElementById('directions').style.display = 'block';

    } catch (err) {
      alert('Routing error: ' + err.message);
    }
  }

  function clearRoute() {
    if (map.getLayer('route')) map.removeLayer('route');
    if (map.getSource('route')) map.removeSource('route');
    if (startMarker) { startMarker.remove(); startMarker = null; }
    if (endMarker) { endMarker.remove(); endMarker = null; }
    startCoord = null; endCoord = null;
    document.getElementById('input-start').value = '';
    document.getElementById('input-end').value = '';
    document.getElementById('directions').style.display = 'none';
    clickMode = 'start';
    hint.style.opacity = '1';
    hint.textContent = 'Tap map to set start point';
  }

  map.on('load', () => {
    map.setFilter('poi_label', ['<=', 'rank', 5]);
    map.on('zoom', () => {
      const zoom = map.getZoom();
      const maxRank = zoom >= 17 ? 999 : zoom >= 16 ? 50 : zoom >= 15 ? 20 : zoom >= 14 ? 10 : 3;
      map.setFilter('poi_label', ['all', ['==', '$type', 'Point'], ['<=', 'rank', maxRank]]);
    });
    map.on('click', 'poi_label', (e) => {
      const props = e.features[0].properties;
      new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(`<strong>${props.name}</strong><br>${props.subclass || props.class || ''}`)
        .addTo(map);
    });
    map.on('mouseenter', 'poi_label', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'poi_label', () => map.getCanvas().style.cursor = '');
  });
</script>
</body>
</html>
