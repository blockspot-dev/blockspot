<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlockSpot</title>

<style>
:root {
  --color-text-primary: #111827;
  --color-text-secondary: #374151;
  --color-border-tertiary: #e5e7eb;
  --color-background-secondary: #f9fafb;

  --radius-lg: 14px;

  --font-xs: 13px;
  --font-sm: 14px;
  --font-md: 16px;
  --font-lg: 18px;
  --font-xl: 22px;
}

/* Base */
body {
  margin: 0;
  background: #ffffff;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, "Helvetica Neue", Arial, sans-serif;

  color: var(--color-text-primary);
}

/* Container */
.app {
  max-width: 420px;
  margin: 0 auto;
  padding: 16px 0;
}

/* Header */
.header {
  text-align: center;
  padding: 24px 16px 20px;
}

.title {
  font-size: var(--font-xl);
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0;
}

.subtitle {
  font-size: var(--font-sm);
  color: var(--color-text-secondary);
  margin-top: 6px;
}

/* Sections */
.section {
  padding: 0 12px;
  margin-bottom: 18px;
}

.section-label {
  font-size: var(--font-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--color-text-secondary);
  margin: 0 0 12px 4px;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* Card link wrapper (IMPORTANT FIX) */
.card-link {
  text-decoration: none;
  color: inherit;
  display: block;
  outline: none;
}

/* Cards */
.card {
  background: var(--color-background-secondary);
  border: 1px solid var(--color-border-tertiary);
  border-radius: var(--radius-lg);
  padding: 20px 14px;
  text-align: center;
  min-height: 110px;

  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

/* Tap feedback */
.card-link:active .card {
  transform: scale(0.98);
}

/* Focus for accessibility */
.card-link:focus-visible .card {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}

/* Medical styling (renamed from emergency) */
.card.medical {
  background: #f3f6ff;   /* soft cool blue */
  border-color: #c7d2fe;
}

.card-icon {
  font-size: 34px;
  margin-bottom: 10px;
}

.card-title {
  font-size: var(--font-md);
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}

.card-title.medical {
  color: #1e3a8a;
}

.card-desc {
  font-size: var(--font-sm);
  line-height: 1.4;
  color: var(--color-text-secondary);
  margin: 0;
}

.card-desc.medical {
  color: #334155;
}

/* Footer */
.footer {
  text-align: center;
  font-size: var(--font-sm);
  color: var(--color-text-secondary);
  padding: 20px;
}
</style>
</head>

<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <p class="title">BlockSpot</p>
    <p class="subtitle">Your neighborhood offline network</p>
  </div>

  <!-- Medical -->
  <div class="section">
    <p class="section-label">Medical</p>

    <div class="grid">

      <a class="card-link" href="http://blockspot.local/kiwix/viewer#medlineplus.gov_en_all_2025-01">
        <div class="card medical">
          <div class="card-icon">🏥</div>
          <p class="card-title medical">MedlinePlus</p>
          <p class="card-desc medical">Medical info</p>
        </div>
      </a>

      <a class="card-link" href="http://blockspot.local/kiwix/viewer#wikipedia_en_medicine_maxi_2026-04">
        <div class="card medical">
          <div class="card-icon">💊</div>
          <p class="card-title medical">WikiMed</p>
          <p class="card-desc medical">Medical reference</p>
        </div>
      </a>

    </div>
  </div>

  <!-- Knowledge -->
  <div class="section">
    <p class="section-label">Knowledge</p>

    <div class="grid">

      <a class="card-link" href="http://blockspot.local/kiwix/viewer#wikipedia_en_all_maxi_2026-02">
        <div class="card">
          <div class="card-icon">📖</div>
          <p class="card-title">Wikipedia</p>
          <p class="card-desc">Full encyclopedia</p>
        </div>
      </a>

      <a class="card-link" href="http://blockspot.local/kiwix/viewer#wikivoyage_en_all_maxi_2026-03">
        <div class="card">
          <div class="card-icon">✈️</div>
          <p class="card-title">Wikivoyage</p>
          <p class="card-desc">Travel guides</p>
        </div>
      </a>

    </div>
  </div>

  <!-- Tools -->
  <div class="section">
    <p class="section-label">Tools</p>

    <div class="grid">

      <a class="card-link" href="http://blockspot.local/mapserver/">
        <div class="card">
          <div class="card-icon">📍</div>
          <p class="card-title">Maps</p>
          <p class="card-desc">Northeast US</p>
        </div>
      </a>

      <a class="card-link" href="http://blockspot.local/kiwix/viewer#ifixit_en_all_2025-12">
        <div class="card">
          <div class="card-icon">🔧</div>
          <p class="card-title">iFixit</p>
          <p class="card-desc">Repair guides</p>
        </div>
      </a>

    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    BlockSpot — no internet required
  </div>

</div>

</body>
</html>
